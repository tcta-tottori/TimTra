name: Build APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: core のユニットテスト
        run: ./gradlew :core:test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: スマホ APK
        run: ./gradlew :app:assembleDebug

      - name: Wear OS APK
        run: ./gradlew :wear:assembleDebug

      - name: APK をまとめる
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/timtra-phone-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk artifacts/timtra-wear-debug.apk
          ls -la artifacts

      - name: APK をアップロード
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timtra-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: テストレポートをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/**
          retention-days: 7

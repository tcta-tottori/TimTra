name: Build APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: 利用可能な SDK を確認
        run: |
          echo "=== installed ==="
          sdkmanager --list_installed || true
          echo "=== available platforms / build-tools ==="
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[4-9]|build-tools;3[4-9]\." | sort -u || true

      - name: 必要な SDK を入れる
        run: |
          for p in "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"; do
            yes | sdkmanager "$p" >/dev/null 2>&1 && echo "installed: $p" || echo "skipped: $p"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: core のユニットテスト
        run: ./gradlew :core:test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: スマホ APK
        run: ./gradlew :app:assembleDebug

      - name: Wear OS APK
        run: ./gradlew :wear:assembleDebug

      - name: APK をまとめる
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/timtra-phone-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk artifacts/timtra-wear-debug.apk
          ls -la artifacts

      - name: APK をアップロード
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timtra-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: テストレポートをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/**
          retention-days: 7
